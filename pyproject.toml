[project]
name = "pipeline-transactions"
version = "0.1.0"
description = "Pipeline data de transactions financières avec CI/CD"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "boto3>=1.35",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
generate-csv = "pipeline.generation.generator:main"
run-pipeline = "pipeline.main:main"
list-s3 = "pipeline.storage.s3:main"
generate-images = "pipeline.generation.images:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeline = ["storage/*.sql", "generation/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests nécessitant la base de données",
    "ocr: tests nécessitant Tesseract (OCR)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
