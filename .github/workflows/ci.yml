name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite-et-tests:
    name: Qualité et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installation des dépendances
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatage (ruff)
        run: ruff format --check .

      - name: Tests unitaires
        run: pytest -m "not integration" --cov=pipeline --cov-report=term-missing

  integration:
    name: Base de données et tests d'intégration
    runs-on: ubuntu-latest
    needs: qualite-et-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      rustfs:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: pipeline
          RUSTFS_SECRET_KEY: pipeline-secret
          RUSTFS_ADDRESS: ":9000"
        ports:
          - 9000:9000
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: pipeline
      DB_PASSWORD: pipeline
      DB_NAME: pipeline
      TEST_DB_NAME: pipeline_test
      REQUIRE_DB: "1"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: pipeline
      S3_SECRET_KEY: pipeline-secret
      S3_BUCKET: transactions
      REQUIRE_S3: "1"
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installation des dépendances
        run: pip install -e ".[dev]"

      - name: Attente du stockage S3
        run: |
          for i in $(seq 60); do
            if curl -fsS http://localhost:9000/health > /dev/null; then echo "Stockage S3 prêt"; exit 0; fi
            sleep 1
          done
          echo "Le stockage S3 ne répond pas"
          exit 1

      - name: Création de la base de test
        run: PGPASSWORD=pipeline psql -h localhost -U pipeline -d pipeline -c "CREATE DATABASE pipeline_test;"

      - name: Tests d'intégration
        run: pytest -m integration -v

      - name: Pipeline complète (génération, envoi S3, lecture depuis S3, insertion)
        run: run-pipeline --input data --generate 5 --seed 42 --upload --source s3 --save

      - name: Relance de la pipeline (aucun doublon attendu)
        run: run-pipeline --input data --generate 5 --seed 42 --upload --source s3 --save

      - name: Vérification du contenu du bucket S3
        run: |
          list-s3
          fichiers=$(list-s3 | grep -c '^s3://')
          test "$fichiers" -eq 5

      - name: Vérification du contenu de la base
        env:
          PGPASSWORD: pipeline
        run: |
          fichiers=$(psql -h localhost -U pipeline -d pipeline -tAc "SELECT COUNT(*) FROM processed_files")
          echo "Fichiers en base : $fichiers"
          test "$fichiers" -eq 5
          ecarts=$(psql -h localhost -U pipeline -d pipeline -tAc "
            SELECT COUNT(*) FROM total_sent_by_iban t
            FULL JOIN v_total_sent_by_iban v USING (iban)
            WHERE t.total IS DISTINCT FROM v.total")
          echo "Écarts entre sommes stockées et recalculées : $ecarts"
          test "$ecarts" -eq 0

      - name: Pannes temporaires à l'insertion (retry puis succès)
        run: run-pipeline --input data-retry --generate 3 --seed 1001 --save --simulate-insert-failures 2 --retry-delay 0.5

      - name: Pannes persistantes (arrêt attendu après 3 tentatives)
        run: |
          if run-pipeline --input data-echec --generate 3 --seed 1002 --save --simulate-insert-failures 10 --retry-delay 0.2; then
            echo "La pipeline aurait dû s'arrêter après le nombre maximal de tentatives"
            exit 1
          fi
          echo "Arrêt attendu : la pipeline s'est arrêtée après 3 tentatives"

      - name: Reprise après l'arrêt
        run: run-pipeline --input data-echec --save

      - name: Pannes temporaires à la récupération S3 (retry puis succès)
        run: run-pipeline --input data-s3-retry --generate 3 --seed 2001 --upload --source s3 --save --simulate-download-failures 2 --retry-delay 0.5

      - name: Fichier S3 inaccessible (arrêt propre attendu)
        run: |
          if run-pipeline --input data-s3-echec --generate 3 --seed 2002 --upload --source s3 --save --simulate-download-failures 10 --retry-delay 0.2; then
            echo "La pipeline aurait dû s'arrêter : le fichier est resté inaccessible"
            exit 1
          fi
          echo "Arrêt attendu : le fichier est resté inaccessible après 3 tentatives"

      - name: Reprise de la récupération depuis S3
        run: run-pipeline --source s3 --save

      - name: Vérification finale du bucket et de la base (aucun doublon)
        env:
          PGPASSWORD: pipeline
        run: |
          objets=$(list-s3 | grep -c '^s3://')
          echo "Objets dans le bucket : $objets (5 + 3 + 3)"
          test "$objets" -eq 11
          fichiers=$(psql -h localhost -U pipeline -d pipeline -tAc "SELECT COUNT(*) FROM processed_files")
          echo "Fichiers en base : $fichiers (5 + 3 + 3 insertion + 3 + 3 récupération S3)"
          test "$fichiers" -eq 17
          ecarts=$(psql -h localhost -U pipeline -d pipeline -tAc "
            SELECT COUNT(*) FROM total_sent_by_iban t
            FULL JOIN v_total_sent_by_iban v USING (iban)
            WHERE t.total IS DISTINCT FROM v.total")
          echo "Écarts entre sommes stockées et recalculées : $ecarts"
          test "$ecarts" -eq 0
