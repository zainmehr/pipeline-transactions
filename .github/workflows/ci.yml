name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite-et-tests:
    name: Qualité et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installation des dépendances
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatage (ruff)
        run: ruff format --check .

      - name: Tests unitaires
        run: pytest -m "not integration" --cov=pipeline --cov-report=term-missing

  integration:
    name: Base de données et tests d'intégration
    runs-on: ubuntu-latest
    needs: qualite-et-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: pipeline
      DB_PASSWORD: pipeline
      DB_NAME: pipeline
      TEST_DB_NAME: pipeline_test
      REQUIRE_DB: "1"
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installation des dépendances
        run: pip install -e ".[dev]"

      - name: Création de la base de test
        run: PGPASSWORD=pipeline psql -h localhost -U pipeline -d pipeline -c "CREATE DATABASE pipeline_test;"

      - name: Tests d'intégration
        run: pytest -m integration -v

      - name: Génération des CSV
        run: generate-csv --output data --files 5 --seed 42

      - name: Traitement et insertion en base
        run: run-pipeline --input data --save