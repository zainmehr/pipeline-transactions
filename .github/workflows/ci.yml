name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installation des dépendances
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatage (ruff)
        run: ruff format --check .

      - name: Tests unitaires
        run: pytest -m "not integration" --cov=pipeline --cov-report=term-missing

      - name: Génération des CSV (smoke test)
        run: generate-csv --output data --files 5 --seed 42